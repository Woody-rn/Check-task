apply plugin: "com.gradleup.shadow"
apply plugin: "org.jooq.jooq-codegen-gradle"

description = 'task-scanner'

dependencies {
    implementation(libs.javalin.bundle)
    implementation(libs.thymeleaf)
    implementation(libs.liquibase.core)
    implementation(libs.postgresql)
    implementation(libs.hikariCP)
    implementation(libs.jooq)
    //implementation("io.minio:minio:9.0.0")

    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform)
}

jar {
    manifest {
        attributes('Main-Class': 'ru.npepub.taskscanner.TaskScanner')
    }
}

if (gradle.startParameter.taskNames.contains(':task-scanner:jooqCodegen') ||
        gradle.startParameter.taskNames.contains('jooqCodegen')) {

    dependencies {
        jooqCodegen(libs.postgresql)
    }

    jooq {
        configuration {
            jdbc {
                driver = 'org.postgresql.Driver'
                url = env.fetch('DB_URL', 'jdbc:postgresql://localhost:5432/mydb_postgres')
                user = env.fetch('DB_USERNAME', 'postgres')
                password = env.fetch('DB_PASSWORD', 'postgres')
            }
            generator {
                name = 'org.jooq.codegen.DefaultGenerator'
                database {
                    name = 'org.jooq.meta.postgres.PostgresDatabase'
                    inputSchema = 'public'
                    includes = '.*'
                    excludes = 'databasechangelog|databasechangeloglock'
                }
                generate {
                    daos = true
                    pojos = false
                    javaTimeTypes = true
                    fluentSetters = true
                }
                target {
                    packageName = 'ru.npepub.taskscanner.jooq.generated'
                    directory = 'src/main/generated-jooq'
                }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs("src/main/generated-jooq")
        }
    }
}
